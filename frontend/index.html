<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ghazalia" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="Daily wisdom from Imam Al-Ghazali's Ihya Ulum al-Din — presented as affirmations for the heart." />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Ghazalia — Wisdom of the Ihya</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@400;500&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0d1117;
      --gold:      #c9a84c;
      --gold-dim:  #8a6f30;
      --cream:     #f5f0e8;
      --text-soft: #4a3f2f;
      --text-muted:#7a6a50;
      --radius:    18px;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: var(--ink);
      color: var(--cream);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #bg-canvas {
      position: fixed; inset: 0; z-index: 0; opacity: 0.35;
    }

    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.04;
    }

    #app {
      position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column;
      padding-top: calc(var(--safe-top) + 16px);
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 56px; flex-shrink: 0;
    }

    .logo {
      font-family: 'Cinzel', serif; font-size: 20px; font-weight: 400;
      letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase;
    }
    .logo span {
      opacity: 0.5; font-size: 13px; display: block; letter-spacing: 0.2em;
      color: var(--cream); font-family: 'Cormorant Garamond', serif;
      font-style: italic; margin-top: -2px;
    }

    .header-right { display: flex; gap: 12px; align-items: center; }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.2);
      background: rgba(201,168,76,0.05);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; color: var(--gold);
    }
    .icon-btn:active { transform: scale(0.94); background: rgba(201,168,76,0.15); }

    .date-strip {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 8px 28px; flex-shrink: 0;
    }
    .date-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, rgba(201,168,76,0.3)); }
    .date-line.right { background: linear-gradient(to left, transparent, rgba(201,168,76,0.3)); }
    .date-text {
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--gold-dim); font-family: 'Cinzel', serif; white-space: nowrap;
    }

    .card-viewport { flex: 1; overflow: hidden; position: relative; padding: 12px 20px; }

    .card-track {
      display: flex; height: 100%; gap: 16px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .quote-card {
      min-width: calc(100% - 0px); height: 100%;
      background: rgba(245,240,232,0.04);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: var(--radius);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 28px 28px; position: relative; overflow: hidden;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }

    .card-ornament-top, .card-ornament-bot {
      position: absolute; left: 50%; transform: translateX(-50%);
      color: var(--gold); opacity: 0.25; font-size: 22px; line-height: 1;
    }
    .card-ornament-top { top: 22px; }
    .card-ornament-bot { bottom: 22px; }

    .card-category {
      font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--gold); opacity: 0.7; margin-bottom: 24px;
    }

    .card-arabic {
      font-family: 'Amiri', serif; font-size: clamp(18px, 5vw, 26px);
      line-height: 1.9; text-align: center; color: rgba(245,240,232,0.65);
      direction: rtl; margin-bottom: 20px; max-width: 340px;
    }

    .card-divider {
      width: 48px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin-bottom: 20px; flex-shrink: 0;
    }

    .card-affirmation {
      font-size: clamp(22px, 6vw, 32px); font-weight: 300; font-style: italic;
      line-height: 1.45; text-align: center; color: var(--cream);
      letter-spacing: 0.01em; margin-bottom: 18px;
    }

    .card-translation {
      font-size: clamp(14px, 3.8vw, 17px); line-height: 1.7; text-align: center;
      color: rgba(245,240,232,0.6); max-width: 320px; font-style: normal;
    }

    .card-source {
      margin-top: 22px; font-size: 11px; letter-spacing: 0.14em;
      color: var(--gold-dim); font-family: 'Cinzel', serif; text-align: center;
    }

    .quote-card::before {
      content: ''; position: absolute; inset: 0; border-radius: var(--radius);
      background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(201,168,76,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Loading skeleton */
    .skeleton-card {
      min-width: 100%; height: 100%;
      border: 1px solid rgba(201,168,76,0.08);
      border-radius: var(--radius);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 40px 28px;
    }
    .skel {
      background: rgba(201,168,76,0.07);
      border-radius: 4px;
      animation: shimmer 1.8s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.9; }
    }

    /* Load error */
    .load-error {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; gap: 12px;
      color: rgba(245,240,232,0.4); text-align: center; padding: 40px;
    }
    .load-error p { font-style: italic; font-size: 16px; line-height: 1.6; }
    .retry-btn {
      margin-top: 8px; padding: 10px 24px; border-radius: 20px;
      border: 1px solid rgba(201,168,76,0.3); background: none;
      color: var(--gold); font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: 0.18em; cursor: pointer; transition: all 0.2s;
    }
    .retry-btn:active { background: rgba(201,168,76,0.1); }

    .swipe-hint { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 0 4px; flex-shrink: 0; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(201,168,76,0.25); transition: all 0.3s; }
    .dot.active { width: 18px; border-radius: 3px; background: var(--gold); }

    .bottom-nav { display: flex; align-items: center; justify-content: space-around; padding: 12px 20px 6px; flex-shrink: 0; }

    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; padding: 8px 16px; border-radius: 12px; border: none;
      background: none; color: rgba(245,240,232,0.35);
      font-family: 'Cormorant Garamond', serif; font-size: 11px;
      letter-spacing: 0.1em; transition: all 0.2s;
    }
    .nav-btn.active { color: var(--gold); }
    .nav-btn:active { transform: scale(0.93); }
    .nav-btn svg { width: 20px; height: 20px; }

    .panel {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(13,17,23,0.97);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex; flex-direction: column;
      padding: calc(var(--safe-top) + 20px) 24px calc(var(--safe-bottom) + 24px);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .panel.open { transform: translateY(0); }

    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }

    .panel-title { font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 0.18em; color: var(--gold); text-transform: uppercase; }

    .close-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.25);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--gold); background: none; transition: all 0.2s;
    }
    .close-btn:active { transform: scale(0.9); }

    .about-section { margin-bottom: 28px; }
    .about-section h3 { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.22em; color: var(--gold); text-transform: uppercase; margin-bottom: 12px; opacity: 0.8; }
    .about-section p { font-size: 16px; line-height: 1.8; color: rgba(245,240,232,0.65); font-style: italic; }

    .quote-list { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; }
    .quote-item { padding: 18px 0; border-bottom: 1px solid rgba(201,168,76,0.08); cursor: pointer; transition: all 0.2s; }
    .quote-item:active { opacity: 0.6; }
    .quote-item-category { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); opacity: 0.6; font-family: 'Cinzel', serif; margin-bottom: 6px; }
    .quote-item-text { font-size: 15px; line-height: 1.6; color: rgba(245,240,232,0.75); font-style: italic; }

    /* Morphology panel */
    .morph-item { padding: 14px 0; border-bottom: 1px solid rgba(201,168,76,0.08); }
    .morph-word { font-family: 'Amiri', serif; font-size: 20px; direction: rtl; color: var(--cream); margin-bottom: 6px; }
    .morph-root { font-size: 12px; letter-spacing: 0.1em; color: var(--gold); font-family: 'Cinzel', serif; margin-bottom: 4px; }
    .morph-def { font-size: 14px; line-height: 1.7; color: rgba(245,240,232,0.6); font-style: italic; }
    .morph-risk { font-size: 12px; margin-top: 6px; color: rgba(201,168,76,0.5); line-height: 1.5; }

    .reflection-panel {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: flex-end;
      background: rgba(0,0,0,0); pointer-events: none; transition: background 0.3s;
    }
    .reflection-panel.open { background: rgba(0,0,0,0.6); pointer-events: all; }
    .reflection-sheet {
      width: 100%; background: #0f1520;
      border-top: 1px solid rgba(201,168,76,0.2);
      border-radius: 22px 22px 0 0;
      padding: 24px 24px calc(var(--safe-bottom) + 32px);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reflection-panel.open .reflection-sheet { transform: translateY(0); }
    .reflection-handle { width: 36px; height: 4px; border-radius: 2px; background: rgba(201,168,76,0.2); margin: 0 auto 20px; }
    .reflection-title { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; margin-bottom: 16px; }
    .reflection-text { font-size: 15px; line-height: 1.9; color: rgba(245,240,232,0.7); font-style: italic; }

    .toast {
      position: fixed; bottom: calc(var(--safe-bottom) + 90px); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.3);
      border-radius: 24px; padding: 10px 22px; font-size: 13px; color: var(--gold);
      letter-spacing: 0.08em; z-index: 50; opacity: 0; transition: all 0.35s;
      white-space: nowrap; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .card-content-inner { display: flex; flex-direction: column; align-items: center; width: 100%; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-content-inner > * { animation: fadeUp 0.6s ease both; }
    .card-content-inner > *:nth-child(1) { animation-delay: 0.05s; }
    .card-content-inner > *:nth-child(2) { animation-delay: 0.12s; }
    .card-content-inner > *:nth-child(3) { animation-delay: 0.18s; }
    .card-content-inner > *:nth-child(4) { animation-delay: 0.24s; }
    .card-content-inner > *:nth-child(5) { animation-delay: 0.30s; }
    .card-content-inner > *:nth-child(6) { animation-delay: 0.36s; }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="grain"></div>

<div id="app">
  <header>
    <div class="logo">
      Ghazalia
      <span>إحياء علوم الدين</span>
    </div>
    <div class="header-right">
      <div class="icon-btn" onclick="openPanel('browse')" title="Browse all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="16" y2="12"/><line x1="3" y1="18" x2="11" y2="18"/>
        </svg>
      </div>
    </div>
  </header>

  <div class="date-strip">
    <div class="date-line"></div>
    <div class="date-text" id="date-display"></div>
    <div class="date-line right"></div>
  </div>

  <div class="card-viewport" id="card-viewport">
    <div class="card-track" id="card-track">
      <!-- Loading skeleton -->
      <div class="skeleton-card">
        <div class="skel" style="width:80px;height:11px;margin-bottom:8px;"></div>
        <div class="skel" style="width:260px;height:22px;"></div>
        <div class="skel" style="width:200px;height:22px;margin-top:6px;"></div>
        <div class="skel" style="width:48px;height:1px;margin:20px 0;"></div>
        <div class="skel" style="width:300px;height:30px;"></div>
        <div class="skel" style="width:240px;height:30px;margin-top:6px;"></div>
        <div class="skel" style="width:280px;height:16px;margin-top:18px;"></div>
        <div class="skel" style="width:220px;height:16px;margin-top:6px;"></div>
      </div>
    </div>
  </div>

  <div class="swipe-hint" id="dots"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="scrollToToday()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round"/>
      </svg>
      Today
    </button>
    <button class="nav-btn" onclick="openPanel('morph')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 6v6m0 0l-3-3m3 3l3-3M5 20h14" stroke-linecap="round"/>
      </svg>
      Roots
    </button>
    <button class="nav-btn" onclick="openReflection()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707M12 21v-1" stroke-linecap="round"/>
      </svg>
      Reflect
    </button>
    <button class="nav-btn" onclick="shareQuote()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m6.632 3.316a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm-6.632-6a3 3 0 105.368-2.684 3 3 0 00-5.368 2.684z" stroke-linecap="round"/>
      </svg>
      Share
    </button>
    <button class="nav-btn" onclick="openPanel('about')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 8h.01M12 12v4m9 0a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"/>
      </svg>
      About
    </button>
  </nav>
</div>

<!-- Side Panel -->
<div class="panel" id="side-panel">
  <div class="panel-header">
    <div class="panel-title" id="panel-title">Browse</div>
    <button class="close-btn" onclick="closePanel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
        <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div id="panel-content"></div>
</div>

<!-- Reflection Sheet -->
<div class="reflection-panel" id="reflection-panel" onclick="closeReflection(event)">
  <div class="reflection-sheet">
    <div class="reflection-handle"></div>
    <div class="reflection-title">Contextual Meaning</div>
    <div class="reflection-text" id="reflection-text"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG — replace with your GitHub username ────────────────────────────
const GITHUB_USER = 'YOUR_GITHUB_USERNAME';
const GITHUB_REPO = 'ghazalia-backend';
const RAW_BASE    = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/frontend/data`;

// ── State ─────────────────────────────────────────────────────────────────
let QUOTES       = [];
let currentIndex = 0;
let todayIndex   = 0;
let touchStartX  = 0;
let touchStartY  = 0;

// ── Fetch data ────────────────────────────────────────────────────────────
async function loadData() {
  try {
    // Try today.json first (fast), then fall back to affirmations.json
    const [todayRes, allRes] = await Promise.all([
      fetch(`${RAW_BASE}/today.json`),
      fetch(`${RAW_BASE}/affirmations.json`),
    ]);

    if (!allRes.ok) throw new Error('Failed to fetch affirmations');

    const all   = await allRes.json();
    const today = todayRes.ok ? await todayRes.json() : null;

    QUOTES = all;

    // Find today's index
    const todayDate = new Date().toISOString().slice(0, 10);
    const idx = all.findIndex(q => q.date === todayDate);
    todayIndex = idx >= 0 ? idx : all.length - 1;

    buildCards();
    goToIndex(todayIndex, false);

  } catch (err) {
    console.error('Load error:', err);
    showLoadError();
  }
}

function showLoadError() {
  document.getElementById('card-track').innerHTML = `
    <div class="load-error" style="min-width:100%">
      <p>Could not reach the archive.<br>Check your connection and try again.</p>
      <button class="retry-btn" onclick="retryLoad()">Retry</button>
    </div>`;
}

function retryLoad() {
  document.getElementById('card-track').innerHTML = `<div class="skeleton-card" style="min-width:100%">
    <div class="skel" style="width:80px;height:11px"></div>
    <div class="skel" style="width:260px;height:22px;margin-top:8px"></div>
    <div class="skel" style="width:48px;height:1px;margin:20px 0"></div>
    <div class="skel" style="width:300px;height:30px"></div>
    <div class="skel" style="width:280px;height:16px;margin-top:18px"></div>
  </div>`;
  loadData();
}

// ── Build cards ───────────────────────────────────────────────────────────
function buildCards() {
  const track = document.getElementById('card-track');
  track.innerHTML = '';

  QUOTES.forEach((q) => {
    const card = document.createElement('div');
    card.className = 'quote-card';
    card.innerHTML = `
      <div class="card-ornament-top">✦</div>
      <div class="card-content-inner">
        <div class="card-category">${q.category || q.theme}</div>
        <div class="card-arabic">${q.arabic}</div>
        <div class="card-divider"></div>
        <div class="card-affirmation">${q.affirmation}</div>
        <div class="card-translation">${q.brief_translation}</div>
        <div class="card-source">${q.book}</div>
      </div>
      <div class="card-ornament-bot">✦</div>`;
    track.appendChild(card);
  });

  buildDots();
}

// ── Dots ──────────────────────────────────────────────────────────────────
function buildDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  const count = Math.min(QUOTES.length, 7);
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    dots.appendChild(d);
  }
  updateDots();
}

function updateDots() {
  const dots = document.querySelectorAll('.dot');
  if (!dots.length) return;
  const ratio = currentIndex / Math.max(QUOTES.length - 1, 1);
  const activePos = Math.round(ratio * (dots.length - 1));
  dots.forEach((d, i) => d.classList.toggle('active', i === activePos));
}

function goToIndex(index, animate = true) {
  currentIndex = Math.max(0, Math.min(QUOTES.length - 1, index));
  const vw    = document.getElementById('card-viewport').offsetWidth;
  const gap   = 16;
  const offset = currentIndex * (vw - 40 + gap);
  const track = document.getElementById('card-track');
  track.style.transition = animate ? 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
  track.style.transform  = `translateX(-${offset}px)`;
  updateDots();
  if (animate) {
    const inner = track.children[currentIndex]?.querySelector('.card-content-inner');
    if (inner) {
      inner.querySelectorAll('*').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });
    }
  }
}

// ── Touch ─────────────────────────────────────────────────────────────────
function onTouchStart(e) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
function onTouchEnd(e) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    dx < 0 ? goToIndex(currentIndex + 1) : goToIndex(currentIndex - 1);
  }
}

// ── Panels ────────────────────────────────────────────────────────────────
function openPanel(mode) {
  const panel   = document.getElementById('side-panel');
  const title   = document.getElementById('panel-title');
  const content = document.getElementById('panel-content');

  if (mode === 'browse') {
    title.textContent = 'All Reflections';
    content.innerHTML = `<div class="quote-list">${QUOTES.map((q,i) => `
      <div class="quote-item" onclick="goToCard(${i})">
        <div class="quote-item-category">${q.category || q.theme}</div>
        <div class="quote-item-text">${q.affirmation}</div>
      </div>`).join('')}</div>`;
  } else if (mode === 'morph') {
    const q    = QUOTES[currentIndex];
    const morph = q?.morphological_analysis || [];
    title.textContent = 'Root Analysis';
    if (!morph.length) {
      content.innerHTML = `<p style="color:rgba(245,240,232,0.4);font-style:italic;line-height:1.7">Morphological analysis is not yet available for this passage. It will appear after the next pipeline run.</p>`;
    } else {
      content.innerHTML = `
        <div style="margin-bottom:20px">
          <div class="card-arabic" style="font-size:18px;margin-bottom:4px">${q.arabic}</div>
          <div style="font-size:11px;letter-spacing:0.18em;color:var(--gold-dim);font-family:'Cinzel',serif">${q.book}</div>
        </div>
        ${morph.map(m => `
          <div class="morph-item">
            <div class="morph-word">${m.arabic_word}</div>
            <div class="morph-root">Root: ${m.root} · Pattern: ${m.pattern}</div>
            <div class="morph-def">${m.lexicon_definition}</div>
            ${m.translation_risk ? `<div class="morph-risk">⚠ Translation risk: ${m.translation_risk}</div>` : ''}
          </div>`).join('')}`;
    }
  } else {
    title.textContent = 'About Ghazalia';
    content.innerHTML = `
      <div class="about-section">
        <h3>The Book</h3>
        <p>Ihya Ulum al-Din — "The Revival of the Religious Sciences" — is the masterwork of Imam Abu Hamid al-Ghazali (1058–1111 CE). Comprising forty books across four quarters, it maps the complete inner life of a Muslim: from knowledge and worship, to virtues and vices, to love, longing, and the remembrance of death.</p>
      </div>
      <div class="about-section">
        <h3>How Affirmations Are Made</h3>
        <p>Each affirmation begins with verbatim Arabic text from the Cairo scholarly edition of the Ihya. Before an English phrase is written, every key word is traced to its tri-literal root, its morphological pattern (وزن), and its definition in classical lexicons including Lisan al-Arab and Mufradat al-Quran. Only then — grounded in what the Arabic actually says at the level of form and root — is the affirmation composed.</p>
      </div>
      <div class="about-section">
        <h3>The Author</h3>
        <p>Al-Ghazali was called Hujjat al-Islam — "The Proof of Islam." After reaching the pinnacle of scholarly prestige, he suffered a spiritual crisis and abandoned everything, spending years in solitary practice before producing the Ihya as his life's testament.</p>
      </div>`;
  }

  panel.classList.add('open');
}

function closePanel() { document.getElementById('side-panel').classList.remove('open'); }

function goToCard(i) { closePanel(); setTimeout(() => goToIndex(i), 300); }

// ── Reflection ────────────────────────────────────────────────────────────
function openReflection() {
  const q = QUOTES[currentIndex];
  if (!q) return;
  document.getElementById('reflection-text').textContent =
    q.contextual_meaning || 'Contextual analysis is being prepared for this passage.';
  document.getElementById('reflection-panel').classList.add('open');
}

function closeReflection(e) {
  if (e.target.id === 'reflection-panel') {
    document.getElementById('reflection-panel').classList.remove('open');
  }
}

// ── Share ─────────────────────────────────────────────────────────────────
function shareQuote() {
  const q = QUOTES[currentIndex];
  if (!q) return;
  const text = `"${q.affirmation}"\n\n— Al-Ghazali, ${q.book}\nغزالية · ghazalia.com`;
  if (navigator.share) {
    navigator.share({ title: 'Ghazalia', text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
  }
}

function scrollToToday() { goToIndex(todayIndex); showToast("Today's reflection"); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Background ────────────────────────────────────────────────────────────
function initBg() {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  let w, h, particles;

  function resize() {
    w = canvas.width  = window.innerWidth;
    h = canvas.height = window.innerHeight;
    particles = Array.from({length: 28}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.8 + 0.4,
      vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.08,
      alpha: Math.random() * 0.5 + 0.1
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w*0.5, h*0.4, 0, w*0.5, h*0.4, w*0.65);
    g.addColorStop(0, 'rgba(120,90,20,0.25)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    particles.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(201,168,76,${p.alpha})`; ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
    });
    requestAnimationFrame(draw);
  }

  resize(); window.addEventListener('resize', resize); draw();
}

// ── Keyboard ──────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goToIndex(currentIndex + 1);
  if (e.key === 'ArrowLeft')  goToIndex(currentIndex - 1);
  if (e.key === 'Escape') {
    closePanel();
    document.getElementById('reflection-panel').classList.remove('open');
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
document.getElementById('date-display').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

const vp = document.getElementById('card-viewport');
vp.addEventListener('touchstart', onTouchStart, { passive: true });
vp.addEventListener('touchend',   onTouchEnd,   { passive: true });

initBg();
loadData();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
